<!DOCTYPE html>
<html lang="es" searchText-sheet="cinematic">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diego Jiménez | Game Developer</title>
  <!-- styles -->
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../../styles/components/project-note.css">
  <!-- templates -->
  <script type="module" defer src="../../scripts/translation.js"></script>
  <script type="module" defer src="../../scripts/templates/main-header.js"></script>
  <script type="module" defer src="../../scripts/templates/side-menu.js"></script>
  <script type="module" defer src="../../scripts/images-gallery.js"></script>
  <script type="module" defer src="../../scripts/templates/main-footer.js"></script>
  <!-- iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="../../data/img/favicon.png">
</head>


<body>
  <header>
    <main-header active="3"></main-header>
  </header>

  <section class="content">
    <side-menu active="3"></side-menu>


    <main class="main-content">
      <!-- Titulo de nota -->
      <section class="project-section pb-0">
        <div class="project-head">
          <h3 class="titulos-sin-subtitulo" searchText="main-title">A future but not for us</h3>
        </div>


        <div class="project-info">

          <section class="media-section">
            <!-- Foto principal -->
            <!-- DEBES CAMBIAR EL "data-Display" a video o image para definir que ser ve de predeterminado-->
            <div class="media-display" id="mediaDisplay" data-display="video">
              <div id="mainImageContainer" class="main-image-container">
                <img src="../../data/img/peep/cover.webp" alt="">
              </div>
              <!--  o... video -->
              <div id="videoContainer" class="video-container">
                <div class="video-overlay">
                  <img id="sliderMainImage" src="../../data/img/cinematic/cover.webp" alt="Thumbnail del video"
                    class="video-thumb" />
                  <div class="play-button">▶</div>
                </div>
                <iframe id="videoIframe" class="video-iframe"
                  data-src="https://www.youtube.com/embed/Z7ZPzIfjsy0?si=8ZiUSMSIqPczqXRO" title="YouTube video player"
                  frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
              </div>
            </div>

            <!-- Galeria de fotos -->
            <div class="mini-gallery-container">
              <div class="mini-gallery-wrapper">
                <div class="mini-gallery-track" id="miniGalleryTrack">
                  <!-- Si no se defien "data-type" el "js" asigna por default "image". a los "videos" hay que definirlos manualmente-->
                  <div class="mini-gallery-item" data-type="video">
                    <img src="../../data/img/cinematic/cover.webp" alt="Imagen 1">
                  </div>
                  <div class="mini-gallery-item">
                    <img src="../../data/img/cinematic/img-1.png" alt="Imagen 2">
                  </div>
                  <div class="mini-gallery-item">
                    <img src="../../data/img/cinematic/img-3.png" alt="Imagen 3">
                  </div>
                  <div class="mini-gallery-item">
                    <img src="../../data/img/cinematic/img-2.png" alt="Imagen 3">
                  </div>
                </div>
              </div>
              <!-- Scroll: Barra inferior -->
              <div class="mini-gallery-scrollbar-container">
                <button class="mini-gallery-nav-button" id="miniGalleryPrevBtn"><span>‹</span></button>
                <div class="mini-gallery-scrollbar-track">
                  <div class="mini-gallery-scrollbar-thumb" id="miniGalleryScrollbarThumb"></div>
                </div>
                <button class="mini-gallery-nav-button" id="miniGalleryNextBtn"><span>›</span></button>
              </div>
            </div>

            <div class="buttons-section">
              <button>
                <a href="https://die-jimenez.itch.io/a-foreigners-story" target="_blank" class="button-itchio">
                  <span searchText="play-button">Jugar en itchio</span>
                  <span class="arrow">›</span>
                </a>
              </button>
            </div>

          </section>

          <!-- Texto: seccion 1 -->
          <div class="text-section">
            <h5 searchText="sb-1">Sobre todo</h5>
            <p searchText="sb-1-p1">parrafo</p>
            <p searchText="sb-1-p2">parrafo</p>
          </div>

          <!-- Texto: seccion negra -->
          <div class="text-dark-container">
            <div class="text-section dark">
            </div>
          </div>


        </div>
      </section>
    </main>
  </section>

  <footer>
    <main-footer></main-footer>
  </footer>
</body>


</html>
